fidelity:
  divergences: Finite hypergraphs use labeled finite vertex types and ordinary injective forbidden-subgraph avoidance.
    Turán density is defined as an infimum, with convergence of the ordinary normalized extremal sequence proved.
    The explicit binary evaluator is specified using Mathlib partial-recursive program semantics and simulated by
    a fixed finite-state two-sided tape machine, in place of the manuscript's one-sided two-track presentation.
    Literal-word encoding and both directions of the correspondence between halting and finite local models are
    proved. Private extensions add a vertex for every core pair, including already covered pairs; graph codes use
    duplicate oriented private vertices and isolated diagonal vertices, with the required mutual homomorphisms proved.
    Bounded obstruction bases enumerate finite labeled graphs rather than isomorphism representatives. The grounded-energy
    estimate uses constant four, and the subsequent absorption inequalities use that proved constant. For Theorem
    1.2, the suspension checker directly tests that a complete three-graph link admits no homomorphism from the
    compiled input graph. The family compiler is primitive recursive jointly in rank and input, and the template
    compiler is primitive recursive in rank, a stronger uniformity assertion than separate fixed-r primitive recursion.
    Higher-uniformity templates use explicit integer clone counts realizing the intended optimal masses; global
    optimality is expressed as an upper bound for every real probability weighting with equality at the uniform
    weighting. For Theorem 1.3, ordinary extremal objects are profiles in the compactification by all finite homomorphism-density
    coordinates. Finite role patterns use multisets, allowing repeated roles in an edge. Balanced class counts have
    the exact total and each is a floor or ceiling of the fixed proportion. The stability conclusion compares graphs
    on their original vertex sets. Both nonempty compact phases preserve the entire inner extremal space by homeomorphisms,
    and the whole outer extremal space is homeomorphic to the product of Bool with the inner extremal space. No
    object-language ZFC or independence conclusion is included.
