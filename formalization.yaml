version: v0.4
project:
  name: Turing Universality in Hypergraph Turán Theory
  description: 'This project formalizes Theorems 1.1, 1.2, and 1.3 of the supplied V4 manuscript on Turing universality
    in hypergraph Turán theory. Theorem 1.1 gives a primitive-recursive compiler from binary words to single finite
    simple three-uniform hypergraphs: ordinary Turán density equals a fixed rational threshold exactly on nonhalting
    inputs and exceeds it exactly on halting inputs. Theorem 1.2 extends the density dichotomy to finite forbidden
    families in every uniformity at least three, with joint primitive-recursive compilers, exact density scaling,
    and input-independent globally optimal templates whose blowups avoid the compiled families. Theorem 1.3 provides
    a jointly primitive-recursive structural compiler above a fixed rank threshold. Nonhalting inputs have one ordinary
    extremal profile and edge-edit stability with fixed finite role patterns and exact balanced class sizes. Halting
    inputs have two disjoint nonempty compact phases, separated by fixed finite test graphs, each homeomorphic to
    the entire inner extremal space. The package includes the finite computation, obstruction, extremal, suspension,
    and effective-construction proofs needed for these three results. One independent Challenge and one Comparator
    configuration select all three theorem declarations.'
  authors:
  - Xizhi Liu
  responsible_maintainers:
  - Xizhi Liu
  license: Apache-2.0
