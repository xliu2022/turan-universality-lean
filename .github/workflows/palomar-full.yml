name: Palomar full mechanical preflight

# Predictive mechanical verification only. This workflow does not submit or
# register a result. The verifier is intentionally pinned; uses and
# pipeline_commit must be updated together after reviewing a newer revision.
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Choose the truthful relationship to this formalization
        required: true
        type: choice
        default: Choose an authorization relationship
        options:
          - Choose an authorization relationship
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  request:
    name: Prepare combined Theorems 1.1–1.3 preflight
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.inputs.outputs.request_id }}
      options: ${{ steps.inputs.outputs.options }}
    steps:
      - name: Validate the declared relationship and exact source revision
        id: inputs
        env:
          PALOMAR_RELATIONSHIP: ${{ inputs.authorization_relationship }}
          PALOMAR_REPOSITORY: ${{ github.repository }}
          PALOMAR_COMMIT: ${{ github.sha }}
          PALOMAR_RUN_ID: ${{ github.run_id }}
          PALOMAR_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re

          relationship = os.environ["PALOMAR_RELATIONSHIP"]
          allowed = {
              "I am a responsible author or maintainer",
              "I have approval from a responsible author or maintainer",
          }
          if relationship not in allowed:
              raise SystemExit("Choose a truthful authorization relationship before running the preflight.")
          commit = os.environ["PALOMAR_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("The selected GitHub ref did not resolve to a full commit SHA.")
          identity = ":".join(os.environ[name] for name in (
              "PALOMAR_REPOSITORY", "PALOMAR_COMMIT", "PALOMAR_RUN_ID", "PALOMAR_RUN_ATTEMPT"
          ))
          request_id = hashlib.sha256(identity.encode()).hexdigest()[:12]
          options = json.dumps({
              "comparator_config_path": "comparator.json",
              "authorization_relationship": relationship,
          }, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"request_id={request_id}\noptions={options}\n")
          print("Repository:", os.environ["PALOMAR_REPOSITORY"])
          print("Commit:", commit)
          print("Selected result: Theorems 1.1, 1.2, and 1.3")
          print("Comparator configuration: comparator.json")
          print("Declared relationship:", relationship)
          PY

  verify:
    name: Official combined full mechanical preflight
    needs: request
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: ${{ needs.request.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ needs.request.outputs.options }}
